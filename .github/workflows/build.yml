# 云上打包：每次推到 main，GitHub 免费的云电脑同时打出四个安装包，
# 自动放到「Releases」页（版本号 = package.json 里的 version）。
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 打包安卓
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          # 固定的签名钥匙：每次打出来的包签名一样，手机上才能直接覆盖升级
          # （把钥匙拷到 ~/.android 在云电脑上不生效，1.0.0、1.0.1 都踩了，必须在这里写明）
          cat >> app/build.gradle <<'GRADLE'
          android { signingConfigs { debug { storeFile file("$rootDir/../ci/debug.keystore") } } }
          GRADLE
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VER\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          # 核对：包的签名必须是仓库里那把钥匙，不对就让打包失败
          WANT=$(keytool -exportcert -keystore ../ci/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          GOT=$($BT/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA-256" | awk '{print $NF}')
          echo "签名指纹：应为 $WANT，实际 $GOT"
          [ "$WANT" = "$GOT" ] || { echo "签名不对，手机上会更新失败"; exit 1; }
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/heshui-$VER-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 选最新的 Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: 打包 iPhone / iPad（不签名，装的时候再用免费 Apple ID 签）
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          for f in Payload/App.app/Frameworks/*.framework; do
            if [ -e "$f" ]; then codesign -f -s - --timestamp=none "$f"; fi
          done
          codesign -f -s - --timestamp=none Payload/App.app
          mkdir -p ../../out
          zip -qry ../../out/heshui-$VER-ios.ipa Payload
      - name: 再打一个苹果官方模拟器用的版本（只用来在 Mac 上录演示画面，真手机装不了它）
        run: |
          VER=$(node -p "require('./package.json').version")
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath build-sim -quiet \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          cd build-sim/Build/Products/Release-iphonesimulator
          codesign -f -s - --timestamp=none App.app
          zip -qry "$GITHUB_WORKSPACE/out/heshui-$VER-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 打包 Windows（安装包：电脑上缺系统网页组件 WebView2 时，安装时自动从微软补上）
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx tauri build --bundles nsis
          mkdir -p out && cp src-tauri/target/release/bundle/nsis/*-setup.exe out/heshui-$VER-win-setup.exe
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 打包 Mac（一个包，新老芯片的 Mac 都能装）
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx tauri build --target universal-apple-darwin --bundles app,dmg
          B=src-tauri/target/universal-apple-darwin/release/bundle
          for a in $B/macos/*.app; do echo "== $a"; codesign -dv "$a" 2>&1 | grep -E "Signature|flags"; codesign --verify --deep --strict "$a" && echo "签名完整" || { echo "签名不完整"; exit 1; }; done
          mkdir -p out && cp $B/dmg/*.dmg out/heshui-$VER-mac.dmg
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*

  release:
    needs: [android, ios, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 放到 Releases 页
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          ls -la out
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --title "喝水打卡 $VER" --notes "云上自动打包：安卓 apk、iPhone/iPad ipa、Windows exe、Mac dmg"
          gh release upload "v$VER" out/* --clobber
