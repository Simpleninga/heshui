# 云上打包：每次推到 main，GitHub 免费的云电脑同时打出四个安装包，
# 自动放到「Releases」页（版本号 = package.json 里的 version）。
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 手机版用不到 Electron，省得每台云电脑都下载 100 多 MB
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 打包安卓
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # 固定的签名钥匙：每次打出来的包签名一样，手机上才能直接覆盖升级
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
          cd android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VER\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/heshui-$VER-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 选最新的 Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: 打包 iPhone / iPad（不签名，装的时候再用免费 Apple ID 签）
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          for f in Payload/App.app/Frameworks/*.framework; do
            if [ -e "$f" ]; then codesign -f -s - --timestamp=none "$f"; fi
          done
          codesign -f -s - --timestamp=none Payload/App.app
          mkdir -p ../../out
          zip -qry ../../out/heshui-$VER-ios.ipa Payload
      - name: 再打一个苹果官方模拟器用的版本（只用来在 Mac 上录演示画面，真手机装不了它）
        run: |
          VER=$(node -p "require('./package.json').version")
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath build-sim -quiet \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          cd build-sim/Build/Products/Release-iphonesimulator
          codesign -f -s - --timestamp=none App.app
          zip -qry "$GITHUB_WORKSPACE/out/heshui-$VER-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*

  windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 打包 Windows
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-desktop/*.exe

  mac:
    runs-on: macos-26
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 打包 Mac（苹果芯片 + 老的英特尔芯片各一个）
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "window.APP_VERSION = '$VER';" > www/version.js
          npm install --no-audit --no-fund
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          for a in dist-desktop/mac*/*.app; do echo "== $a"; codesign -dv "$a" 2>&1 | head -5; codesign --verify --deep "$a" && echo "签名完整" || echo "签名不完整"; done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist-desktop/*.dmg

  release:
    needs: [android, ios, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 放到 Releases 页
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          ls -la out
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --title "喝水打卡 $VER" --notes "云上自动打包：安卓 apk、iPhone/iPad ipa、Windows exe、Mac dmg"
          gh release upload "v$VER" out/* --clobber
